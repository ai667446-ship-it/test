<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/yusei-magic/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource/zen-maru-gothic/900.css">
<style>html,body{margin:0;background:#000}#stage{width:1080px;height:1920px}#pre{position:absolute;left:-99999px;top:0;width:4000px}</style>
</head><body>
<div id="stage"></div>
<img id="hand" src="../assets/hand_point.png" style="position:absolute;left:0;top:0;transform-origin:255px 222px;display:none">
<div id="pre"><span id="p1" style="font-family:'Yusei Magic'"></span><span id="p2" style="font-family:'Zen Maru Gothic';font-weight:900"></span></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="versions.js"></script>
<script src="episodes.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const V = params.get('v') || 'a';
  const handEl = document.getElementById('hand');
  window.WARP = null;
  const unwarp = (T) => {
    if (!window.WARP) return T;
    for (const [n0, n1, o0, o1] of window.WARP) if (T < n1) return o0 + (T - n0) / (n1 - n0) * (o1 - o0);
    const l = window.WARP[window.WARP.length - 1]; return l[3];
  };
  window.draw = (T) => {
    const t = unwarp(T);
    window.TALK = (window.VOICE || []).some((c) => T >= c.start && T < c.start + c.len);
    document.getElementById('stage').innerHTML = renderAt(V, t);
    if (HAND && HAND.opacity > 0) {
      handEl.style.display = 'block';
      handEl.style.opacity = HAND.opacity;
      // 指先 (255,222) を (x,y) に合わせる。タップの瞬間だけ上のオレンジの印を見せる
      handEl.style.transform = `translate(${HAND.x - 255}px, ${HAND.y - 222}px) rotate(${HAND.rot}deg) scale(${HAND.s})`;
      handEl.style.clipPath = HAND.marks ? 'none' : 'inset(180px 0 0 0)';
    } else handEl.style.display = 'none';
  };
  window.prepareFonts = async () => {
    let txt = allText();
    const D = VERSIONS[V].duration;
    for (let t = 0; t < D; t += 0.5) { draw(t); txt += document.querySelector('#stage svg').textContent; }
    document.getElementById('p1').textContent = txt;
    document.getElementById('p2').textContent = txt;
    await document.fonts.ready;
    await new Promise(r => setTimeout(r, 300));
    await handEl.decode();
    await document.fonts.ready;
    return [...document.fonts].filter(f => f.status === 'loaded').length;
  };
  window.meta = () => ({ duration: VERSIONS[V].duration, cues: VERSIONS[V].captions.map(c => c[0]), scenes: VERSIONS[V].scenes.map(s => s.from), names: VERSIONS[V].scenes.map(s => s.name), speeds: VERSIONS[V].scenes.map(s => s.speed), offsets: VERSIONS[V].scenes.map(s => s.offset), bgm: VERSIONS[V].bgm || 'pluck' });
  draw(Number(params.get('t') || 0));
</script>
</body></html>
